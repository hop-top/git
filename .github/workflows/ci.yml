name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      # Cheapest check, so it runs first: a formatting-only failure should not
      # wait behind a full build. `gofmt -l` prints offending files and exits 0
      # either way, so the non-empty output is what we test.
      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt drift in the following files; run 'make fmt' and commit the result:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Lint
        run: staticcheck ./...

      # Full suite is ~50s locally, dominated by test/e2e (real git subprocesses)
      # now that those tests run with t.Parallel. 300s is ~6x that: it keeps
      # the old ~5x policy and still absorbs CI runners at 2-3x local speed.
      # Blowing through this is a signal to investigate, not to raise the number:
      # the last regression here was a redundant `go build` per e2e test, not
      # genuine work.
      #
      # This covers the .txtar suite in test/script too. That package holds only
      # _test.go files, so `go list ./...` omits it while `go test ./...` still
      # builds and runs it — no separate step is needed, and adding one would
      # run those scripts twice.
      - name: Run Tests
        run: go test -timeout 300s -coverprofile=coverage.out ./...

      - name: Upload Coverage
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage.out

  build-matrix:
    name: Build Matrix
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build .
