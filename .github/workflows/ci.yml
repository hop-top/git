name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Lint
        run: staticcheck ./...

      # Full suite is ~3min locally, dominated by test/e2e (real git subprocesses).
      # 900s is roughly 5x that, leaving headroom for slower CI runners. Blowing
      # through this is a signal to investigate, not to raise the number: the last
      # regression here was a redundant `go build` per e2e test, not genuine work.
      - name: Run Tests
        run: go test -timeout 900s -coverprofile=coverage.out ./...

      - name: Upload Coverage
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage.out

  build-matrix:
    name: Build Matrix
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build .
